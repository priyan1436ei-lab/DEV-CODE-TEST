appId: com.devmind.studio
productName: DevMind Studio
copyright: Copyright © 2026 DevMind Systems
compression: maximum
publish: null
asar: true
asarUnpack:
  - electron/assets/**/*
  - dist/**/*
  - dist-server/**/*
directories:
  buildResources: electron/assets
  output: dist-electron
files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - firebase-applet-config.json
  - package.json
  - "!data/**"
  - "!.env*"
  - "!src/**"
  - "!server/**"
  - "!server.ts"
  - "!node_modules/**"
  - "!**/*.map"
  - "!security_spec.md"
  - "!firestore.rules.test.ts"
  - "!DRAFT_firestore.rules"
win:
  icon: electron/assets/icon.ico
  signAndEditExecutable: true
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: "${productName}-${version}-${os}-${arch}-Setup.${ext}"
  installerIcon: electron/assets/icon.ico
  uninstallerIcon: electron/assets/icon.ico
  installerHeaderIcon: electron/assets/icon.ico
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DevMind Studio
  deleteAppDataOnUninstall: false
  runAfterFinish: true
portable:
  artifactName: "${productName}-${version}-${os}-${arch}-Portable.${ext}"
