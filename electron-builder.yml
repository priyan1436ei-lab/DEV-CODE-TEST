appId: com.devmind.studio
productName: DevMind Studio
copyright: Copyright © 2026 DevMind Systems
compression: maximum
asar: true
asarUnpack:
  - server/**/*
  - server.ts
  - src/types/**/*
  - node_modules/tsx/**/*
  - node_modules/esbuild/**/*
directories:
  output: dist-electron
files:
  - dist/**/*
  - server/**/*
  - server.ts
  - src/types/**/*
  - electron/**/*
  - firebase-applet-config.json
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: DevMind-Studio-${version}-${arch}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DevMind Studio
  deleteAppDataOnUninstall: false
  runAfterFinish: true
portable:
  artifactName: DevMind-Studio-${version}-${arch}-Portable.${ext}
